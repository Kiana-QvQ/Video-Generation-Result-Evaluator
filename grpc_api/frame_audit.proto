syntax = "proto3";

package frame_audit;

message Empty {}

message JsonResponse {
  string json = 1;
  int32 http_status = 2;
}

message HardwareRequest {
  string device = 1;
}

message ListJobsRequest {
  int32 limit = 1;
}

message PublicShowcaseRequest {
  int32 limit = 1;
  string query = 2;
  string category = 3;
}

message PublicShowcaseItemRequest {
  string item_id = 1;
}

message PublicShowcaseFileRequest {
  string item_id = 1;
  string file_key = 2;
}

message JobRequest {
  string job_id = 1;
}

message UpdateJobRequest {
  string job_id = 1;
  optional string name = 2;
  string action = 3;
  optional string prompt_text = 4;
  optional int32 max_frames = 5;
  optional bool calculate_lpips = 6;
  optional string device = 7;
  optional string manual_expression_score = 8;
  optional string manual_aesthetic_score = 9;
  optional bool wangxing_au_enabled = 10;
  optional string wangxing_expected_class = 11;
}

message DownloadRequest {
  string run_id = 1;
  string filename = 2;
}

message JobOptions {
  string prompt_text = 1;
  optional int32 max_frames = 2;
  optional bool calculate_lpips = 3;
  string device = 4;
  string manual_expression_score = 5;
  string manual_aesthetic_score = 6;
  optional bool wangxing_au_enabled = 7;
  optional string wangxing_expected_class = 8;
}

message UploadChunk {
  string file_id = 1;
  string field_name = 2;
  string filename = 3;
  string content_type = 4;
  bytes data = 5;
  bool first = 6;
  bool last = 7;
}

message UploadRequest {
  oneof payload {
    JobOptions options = 1;
    UploadChunk chunk = 2;
  }
}

message DownloadChunk {
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
  bool eof = 4;
}

service FrameAudit {
  rpc Health(Empty) returns (JsonResponse);
  rpc Models(Empty) returns (JsonResponse);
  rpc Hardware(HardwareRequest) returns (JsonResponse);
  rpc CreateJob(stream UploadRequest) returns (JsonResponse);
  rpc Evaluate(stream UploadRequest) returns (JsonResponse);
  rpc ListJobs(ListJobsRequest) returns (JsonResponse);
  rpc ListPublicShowcase(PublicShowcaseRequest) returns (JsonResponse);
  rpc GetPublicShowcase(PublicShowcaseItemRequest) returns (JsonResponse);
  rpc DownloadPublicShowcaseFile(PublicShowcaseFileRequest) returns (stream DownloadChunk);
  rpc GetJob(JobRequest) returns (JsonResponse);
  rpc UpdateJob(UpdateJobRequest) returns (JsonResponse);
  rpc DeleteJob(JobRequest) returns (JsonResponse);
  rpc DownloadRunFile(DownloadRequest) returns (stream DownloadChunk);
}
